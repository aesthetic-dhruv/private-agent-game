name: Build Android APK

# Builds Voxel Heist for Android in the cloud, so you do not need a PC.
# Trigger: every push to main, plus manual Run workflow in the Actions tab.
# Output: a debug .apk uploaded as a GitHub Actions artifact.
# Download it from Actions -> this workflow run -> Artifacts, then
# install it on your Android phone (see README, CI section).
#
# Why a standard Ubuntu runner + official Godot headless, not a
# third-party Godot export action: the user asked for either route.
# This route uses only official sources (Godot releases, actions/setup-java,
# android-actions/setup-android), so the version, SDK and keystore steps
# are visible and debuggable. A third-party action can change inputs
# without notice and hide a failure.
#
# IMPORTANT, READ BEFORE YOU RELY ON THIS:
# Node 24 action versions (Run #1 used Node 20 actions and failed):
# - actions/checkout v5, actions/setup-java v5, android-actions/setup-android v4,
#   actions/upload-artifact v6 are the FIRST majors declaring runs.using: node24.
#   Do NOT "fix" this by going to checkout@v4.2.2 or upload-artifact@v5 —
#   both still declare node20 and would leave the deprecation/failure in place.
# - Inputs used here are unchanged across these bumps: checkout (none),
#   setup-java (distribution + java-version), setup-android (none — its v4
#   default is platform-tools only, dropping the removed 'tools' package
#   that v3 tried to install), upload-artifact (name + path + if-no-files-found).
#   GitHub-hosted runners already satisfy the v2.327.1+ runner floor.
# Run #5 root-cause fix (Run #4 blank configuration error):
# - project.godot was missing textures/vram_compression/import_etc2_astc=true
#   under [rendering]. Multiple Godot Android guides note exactly this:
#   without it, Android export fails with an empty "configuration errors"
#   message — which matches Run #4's log (error line, then a blank line,
#   no specific error listed). The preset already sets texture_format/etc2=true,
#   so the project import setting must match it.
# - In addition, the preset now carries explicit custom_template/debug and
#   custom_template/release paths and an absolute keystore/debug path, and
#   this workflow rewrites those preset lines at runtime to the actual
#   workspace/template paths, so preset and editor settings cannot disagree.
# Workspace-local Godot user dirs (Run #4):
# - Godot has NO editor setting to point to an arbitrary templates
#   folder, so a literal ${GITHUB_WORKSPACE}/templates/ folder alone
#   would be ignored and export would fail with templates not found.
#   On Linux Godot follows the XDG spec, so the working override is
#   XDG_DATA_HOME / XDG_CONFIG_HOME / XDG_CACHE_HOME. Setting those
#   to dot-folders inside the workspace moves BOTH the templates
#   (XDG_DATA_HOME/godot/export_templates/<version>/) and the editor
#   settings (XDG_CONFIG_HOME/godot/editor_settings-4.tres) into the
#   workspace, where the log dump can show them. Dot-folders are used
#   on purpose: a plain templates/ folder at the project root would
#   be scanned as project resources and could be pulled into the
#   export (preset export_filter is all_resources).
# - This workflow has NOT been run in GitHub Actions from this sandbox.
#   It is the standard Godot 4.2 headless export sequence, written to
#   match this project's project.godot (Godot 4.2, mobile renderer).
#   If a later run fails, the Actions log will show exactly which step
#   failed (templates, SDK, keystore, export).
# - The debug keystore below is generated fresh on every run, exactly
#   as requested, so the build does not fail for a missing keystore.
#   Consequence: each CI APK has a DIFFERENT signature. Android will
#   refuse to install a new CI APK over an old CI APK. Uninstall the
#   old Voxel Heist APK from your phone first, then install the new one.
#   To keep one signature across builds, store a persistent debug
#   keystore as a base64 GitHub Secret and restore it instead of
#   generating a new one (see the commented step near the keystore step).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.2.2"
      GODOT_STATUS: "stable"
      # Godot 4.2 targets Android API 34. Keep these in sync with
      # the export preset in export_presets.cfg.
      ANDROID_API: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Download official Godot headless + export templates
        run: |
          set -e
          # Workspace-local XDG dirs (see header comment). Persist
          # them via GITHUB_ENV so every later Godot step uses the
          # same template + editor-settings locations.
          export XDG_DATA_HOME="${GITHUB_WORKSPACE}/.godot-xdg/data"
          export XDG_CONFIG_HOME="${GITHUB_WORKSPACE}/.godot-xdg/config"
          export XDG_CACHE_HOME="${GITHUB_WORKSPACE}/.godot-xdg/cache"
          echo "XDG_DATA_HOME=$XDG_DATA_HOME" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          TEMPLATE_DIR="$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          echo "TEMPLATE_DIR=$TEMPLATE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$HOME/godot" "$TEMPLATE_DIR"
          cd "$HOME/godot"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -O godot.zip
          unzip -o godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot
          echo "$HOME/godot" >> "$GITHUB_PATH"
          # Export templates MUST match the Godot version exactly.
          # With the XDG override above, the template dir is
          # ${GITHUB_WORKSPACE}/.godot-xdg/data/godot/export_templates/4.2.2.stable
          # instead of $HOME/.local/share/godot/export_templates/4.2.2.stable.
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -O templates.tpz
          unzip -o templates.tpz -d "$TEMPLATE_DIR"
          # The .tpz unpacks into a folder literally named templates/;
          # Godot looks for a folder named after the version, so move
          # the files up one level if that subfolder exists.
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            mv "$TEMPLATE_DIR/templates/"* "$TEMPLATE_DIR/"
            rmdir "$TEMPLATE_DIR/templates" || true
          fi
          # Godot also expects version.txt next to the templates.
          echo "${GODOT_VERSION}.${GODOT_STATUS}" > "$TEMPLATE_DIR/version.txt"
          # Explicit template execution permissions. The .apk templates
          # are not scripts, so this does not change Godot's export
          # logic — it only guarantees the runner cannot block on a
          # missing execute bit for the extracted template files.
          chmod +x "$TEMPLATE_DIR"/*.apk || true
          chmod -R a+rX "$TEMPLATE_DIR"
          echo "=== Template directory (absolute, workspace-local) ==="
          ls -lh "$TEMPLATE_DIR"
          echo "=== Strict template check: fail here, not in export ==="
          test -f "$TEMPLATE_DIR/android_debug.apk" || { echo "::error::Missing $TEMPLATE_DIR/android_debug.apk"; exit 1; }
          test -f "$TEMPLATE_DIR/android_release.apk" || { echo "::error::Missing $TEMPLATE_DIR/android_release.apk"; exit 1; }
          test -f "$TEMPLATE_DIR/version.txt" || { echo "::error::Missing $TEMPLATE_DIR/version.txt"; exit 1; }
          cat "$TEMPLATE_DIR/version.txt"

      - name: Verify Godot version
        run: godot --version

      - name: Generate temporary debug keystore
        # This is a DEBUG keystore only. Never use it for a Play Store release.
        # If you later want one signature across builds, replace this step
        # with restoring a base64 keystore from a GitHub Secret, for example:
        #   echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
        # and keep the same alias / passwords below.
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Configure Godot editor settings for Android SDK
        # Headless export reads the SDK path and debug keystore from
        # Godot's editor settings, not just from ANDROID_HOME.
        # Godot 4 editor settings are a .tres resource, NOT the old
        # Godot 3 .cfg format: the previous editor_settings-4.2.cfg
        # with an [export] section was ignored by Godot 4, which is
        # a likely cause of the Run #2 "configuration errors" exit 1.
        # Godot 4.2 reads editor_settings-4.tres; write the 4.2 name
        # as well so either lookup finds the same settings.
        # Android export validation also needs java_sdk_path, so
        # include JAVA_HOME (set by setup-java) explicitly.
        run: |
          set -e
          # With the XDG override, Godot reads editor settings from
          # $XDG_CONFIG_HOME/godot/, NOT from $HOME/.config/godot/.
          # Write to the XDG location first, and keep a $HOME copy as
          # a fallback in case an XDG variable is ever lost.
          CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$CONFIG_DIR" "$HOME/.config/godot"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' "export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\"" "export/android/java_sdk_path = \"${JAVA_HOME}\"" "export/android/debug_keystore = \"${GITHUB_WORKSPACE}/debug.keystore\"" 'export/android/debug_keystore_user = "androiddebugkey"' 'export/android/debug_keystore_pass = "android"' > "$CONFIG_DIR/editor_settings-4.tres"
          cp "$CONFIG_DIR/editor_settings-4.tres" "$CONFIG_DIR/editor_settings-4.2.tres"
          cp "$CONFIG_DIR/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.tres"
          cp "$CONFIG_DIR/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.2.tres"
          echo "=== Editor settings (XDG) ==="
          echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME}"
          echo "CONFIG_DIR=$CONFIG_DIR"
          cat "$CONFIG_DIR/editor_settings-4.tres"
          ls -lh "$CONFIG_DIR/"

      - name: Inject explicit template + keystore paths into preset
        # Run #5 fix, part 1: explicit template paths.
        # Godot 4.2 preset options custom_template/debug and
        # custom_template/release, if empty, use the default template
        # lookup. Setting them explicitly removes auto-detection as
        # a failure mode. The committed preset already contains the
        # standard GitHub runner absolute paths, but a preset file
        # cannot expand ${GITHUB_WORKSPACE} itself, so this step
        # rewrites those lines to the ACTUAL workspace + template
        # dir for this run (identical on standard runners, robust
        # if the runner workspace root ever changes).
        # Run #5 fix, part 2: keystore mapping.
        # keystore/debug in the preset is rewritten to the exact
        # absolute path used in editor settings, so preset and
        # editor settings cannot disagree. The export step also sets
        # GODOT_ANDROID_KEYSTORE_DEBUG_PATH/USER/PASSWORD, which
        # Godot documents as overriding the preset keystore fields.
        run: |
          set -e
          TEMPLATE_DIR="${TEMPLATE_DIR:-$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}}"
          python3 - << 'PYEOF'
          import os, re
          ws = os.environ["GITHUB_WORKSPACE"]
          tpl = os.environ.get("TEMPLATE_DIR") or os.path.join(os.environ.get("XDG_DATA_HOME", ""), "godot", "export_templates", os.environ["GODOT_VERSION"] + "." + os.environ["GODOT_STATUS"])
          path = os.path.join(ws, "export_presets.cfg")
          text = open(path).read()
          def set_opt(text, key, value):
              line = f'{key}="{value}"'
              if re.search(rf'^{re.escape(key)}=.*$', text, re.M):
                  return re.sub(rf'^{re.escape(key)}=.*$', line, text, count=1, flags=re.M)
              # Insert right after the [preset.0.options] header.
              return text.replace("[preset.0.options]\n", "[preset.0.options]\n" + line + "\n", 1)
          text = set_opt(text, "custom_template/debug", os.path.join(tpl, "android_debug.apk"))
          text = set_opt(text, "custom_template/release", os.path.join(tpl, "android_release.apk"))
          text = set_opt(text, "keystore/debug", os.path.join(ws, "debug.keystore"))
          text = set_opt(text, "keystore/debug_user", "androiddebugkey")
          text = set_opt(text, "keystore/debug_password", "android")
          open(path, "w").write(text)
          PYEOF
          echo "=== Preset after injection ==="
          grep -E "custom_template/|keystore/debug" "${GITHUB_WORKSPACE}/export_presets.cfg"
          test -f "${TEMPLATE_DIR}/android_debug.apk" || { echo "::error::custom_template/debug target missing"; exit 1; }
          test -f "${TEMPLATE_DIR}/android_release.apk" || { echo "::error::custom_template/release target missing"; exit 1; }
          test -f "${GITHUB_WORKSPACE}/debug.keystore" || { echo "::error::keystore/debug target missing"; exit 1; }

      - name: Import project (creates .godot/ import cache)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/android"
          godot --headless --path "${GITHUB_WORKSPACE}" --import --quit || echo "import exited $? (non-zero on first import is not fatal, continuing)"

      - name: Pre-export check (log dump before export)
        run: |
          set -e
          echo "=== Workspace (absolute) ==="
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          ls -la "${GITHUB_WORKSPACE}"
          echo "=== Required project files ==="
          test -f "${GITHUB_WORKSPACE}/export_presets.cfg" || { echo "::error::Missing export_presets.cfg"; exit 1; }
          test -f "${GITHUB_WORKSPACE}/project.godot" || { echo "::error::Missing project.godot"; exit 1; }
          ls -la "${GITHUB_WORKSPACE}/export_presets.cfg" "${GITHUB_WORKSPACE}/project.godot"
          echo "=== Preset + project config checks (Run #5 root-cause fix) ==="
          grep -E "custom_template/|keystore/debug" "${GITHUB_WORKSPACE}/export_presets.cfg"
          grep -q "textures/vram_compression/import_etc2_astc=true" "${GITHUB_WORKSPACE}/project.godot" || { echo "::error::Missing textures/vram_compression/import_etc2_astc=true in project.godot — Android export fails with a blank configuration error without it"; exit 1; }
          echo "import_etc2_astc=true present in project.godot"
          echo "=== Android SDK / JDK ==="
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "JAVA_HOME=${JAVA_HOME}"
          test -x "${ANDROID_SDK_ROOT}/platform-tools/adb" || { echo "::error::adb not found at ${ANDROID_SDK_ROOT}/platform-tools/adb"; exit 1; }
          test -x "${JAVA_HOME}/bin/jarsigner" || { echo "::error::jarsigner not found at ${JAVA_HOME}/bin/jarsigner"; exit 1; }
          test -f "${GITHUB_WORKSPACE}/debug.keystore" || { echo "::error::Missing debug.keystore"; exit 1; }
          ls -lh "${GITHUB_WORKSPACE}/debug.keystore"
          echo "=== Export templates (absolute, workspace-local, re-checked) ==="
          echo "XDG_DATA_HOME=${XDG_DATA_HOME}"
          echo "TEMPLATE_DIR=${TEMPLATE_DIR:-$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}}"
          ls -la "${GITHUB_WORKSPACE}/.godot-xdg"
          ls -lh "${TEMPLATE_DIR:-$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}}"
          test -f "${TEMPLATE_DIR:-$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}}/android_debug.apk" || { echo "::error::android_debug.apk missing before export"; exit 1; }
          test -f "${TEMPLATE_DIR:-$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}}/android_release.apk" || { echo "::error::android_release.apk missing before export"; exit 1; }
          echo "=== Output directory ==="
          mkdir -p "${GITHUB_WORKSPACE}/build/android"
          ls -la "${GITHUB_WORKSPACE}/build/android"

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        # Preset name must match export_presets.cfg exactly: "Android".
        # use_gradle_build is false in that preset, so this export does
        # NOT need Gradle. It signs the prebuilt template APK with the
        # debug keystore generated above.
        # --verbose is deliberate: if this still fails, the log must
        # show Godot's actual configuration error, not just exit 1.
        # --display-driver headless + --audio-driver Dummy are the
        # Godot 4 explicit no-window fallbacks (--no-window is a
        # Godot 3 flag and is not used here).
        # Exit-code handling is NOT a blind bypass: Godot headless
        # can exit non-zero on shutdown warnings even when the APK
        # was produced. So a non-zero exit is only forgiven when the
        # APK exists, is non-empty, and passes a ZIP integrity check.
        # If the APK is missing or corrupt, this step fails hard and
        # dumps the output directory for diagnosis.
        run: |
          set +e
          godot --headless --display-driver headless --audio-driver Dummy --verbose --path "${GITHUB_WORKSPACE}" --export-debug "Android" "${GITHUB_WORKSPACE}/build/android/VoxelHeist.apk"
          EXPORT_EXIT=$?
          set -e
          echo "Godot export exit code: $EXPORT_EXIT"
          echo "=== Export output ==="
          ls -lh "${GITHUB_WORKSPACE}/build/android/" || true
          if [ -s "${GITHUB_WORKSPACE}/build/android/VoxelHeist.apk" ] && unzip -t "${GITHUB_WORKSPACE}/build/android/VoxelHeist.apk" > /dev/null 2>&1; then
            if [ "$EXPORT_EXIT" -ne 0 ]; then
              echo "::warning::Godot exited $EXPORT_EXIT but VoxelHeist.apk exists and passes the ZIP check, so this is treated as a non-fatal shutdown warning, not a failed export."
            fi
            echo "VoxelHeist.apk is valid, continuing to artifact upload."
          else
            echo "::error::Godot export failed (exit $EXPORT_EXIT) and no valid VoxelHeist.apk was produced."
            ls -la "${GITHUB_WORKSPACE}/build/android/" || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: voxel-heist-android-apk
          path: build/android/*.apk
          if-no-files-found: error
